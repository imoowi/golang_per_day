apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiservices.ai.example.com
spec:
  group: ai.example.com
  names:
    kind: AIService
    plural: aiservices
    singular: aiservice
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: GPU
          type: integer
          jsonPath: .spec.resources.gpu
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["model", "image", "resources"]
              properties:
                model:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                image:
                  type: string
                resources:
                  type: object
                  required: ["gpu", "memory"]
                  properties:
                    gpu:
                      type: integer
                      minimum: 0
                    memory:
                      type: string
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                phase:
                  type: string
                message:
                  type: string